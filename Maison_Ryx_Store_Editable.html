<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Maison Ryx</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#1c1712;--mute:#7a6f60;--gold:#a8842f;--line:#e6dccb;--dark:#1c1712;--onDark:#f3e9d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120f0b;--card:#1c1712;--ink:#f3e9d2;--mute:#a49782;--gold:#d4af5f;--line:#33291d;--dark:#000;--onDark:#f3e9d2}}
:root[data-theme="dark"]{--bg:#120f0b;--card:#1c1712;--ink:#f3e9d2;--mute:#a49782;--gold:#d4af5f;--line:#33291d;--dark:#000;--onDark:#f3e9d2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;font-weight:300}
.bar{background:var(--dark);color:var(--onDark);text-align:center;font-size:13px;padding:8px 12px;letter-spacing:.5px}
header{text-align:center;padding:38px 16px 10px}
.logo{font-family:Amiri,serif;font-size:clamp(40px,8vw,68px);letter-spacing:6px;color:var(--gold);margin:0;font-weight:400}
.logo span{display:block;font-size:12px;letter-spacing:8px;color:var(--mute);font-family:Cairo,sans-serif;margin-top:-4px}
.hero{max-width:760px;margin:18px auto 0;font-family:Amiri,serif;font-size:clamp(18px,3vw,24px);line-height:1.9}
.hero i{display:block;width:60px;height:1px;background:var(--gold);margin:18px auto}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;max-width:1100px;margin:22px auto 8px;padding:0 16px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 18px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;width:100%}
.tools input{max-width:240px;border-radius:99px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;max-width:1200px;margin:16px auto 40px;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.img{aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(160deg,var(--line),transparent);overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;inset-inline-start:10px;background:var(--gold);color:#fff;font-size:11px;padding:3px 10px;border-radius:99px}
.body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.kind{font-size:11px;color:var(--gold);letter-spacing:1px}
.name{font-family:Amiri,serif;font-size:21px;font-weight:700;margin:0}
.notes,.desc{font-size:13px;color:var(--mute);margin:0;line-height:1.7}
.price{margin-top:auto;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.price s{color:var(--mute);font-weight:300;font-size:13px}.price b{color:var(--gold);font-size:12px}
.out{opacity:.55}
.adm{display:flex;gap:6px;margin-top:8px}
.btn{background:var(--ink);color:var(--bg);border:0;padding:9px 16px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
#admin{text-align:center;padding:12px}
dialog{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;width:min(520px,94vw);padding:20px}
dialog::backdrop{background:#000a}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:4px}.f .w{grid-column:1/-1}
footer{background:var(--dark);color:var(--onDark);text-align:center;padding:36px 16px;font-size:13px}
footer .logo{font-size:30px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;display:none;z-index:9}

#admin{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.manager{max-width:1100px;margin:0 auto 10px;padding:0 16px}
.managerBox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.managerBox span{font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<div class="bar">توصيل سريع · عينات مجانية مع كل طلب · عطور بتوقيع خاص</div>
<header>
<h1 class="logo">MAISON RYX<span>PARFUMS · عطور</span></h1>
<p class="hero">عطور تُصنع بشغف، وتُختار بعناية.<i></i>من تصميمنا الخاص ومن مختاراتنا</p>
</header>
<div class="tools"><div id="chips"></div><input id="q" type="search" placeholder="ابحث عن عطر…"></div>
<div id="admin"><button class="btn" id="manage">إدارة المتجر</button></div>
<main id="grid"></main>
<footer><div class="logo">MAISON RYX</div><p>© 2026 Maison Ryx · جميع الحقوق محفوظة</p></footer>

<dialog id="dlg">
<div class="f">
<label class="w">اسم العطر<input id="fn"></label>
<label>السعر<input id="fp" type="number" min="0"></label>
<label>السعر قبل الخصم (اختياري)<input id="fo" type="number" min="0"></label>
<label>الحجم (مل)<input id="fs" type="number" min="0"></label>
<label>القسم<select id="fc"><option value="perfume">عطور</option><option value="oil">#</option><option value="incense">#</option><option value="mist">#</option></select></label>
<label>المصدر<select id="fk"><option value="own">من تصميمي</option><option value="brought">مختارات</option></select></label>
<label>شارة (اختياري)<select id="fb"><option value="">بدون</option><option>جديد</option><option>الأكثر مبيعًا</option><option>إصدار محدود</option></select></label>
<label class="w">المكونات / الروائح (مثال: عود، ورد، عنبر)<input id="fnotes"></label>
<label class="w">الوصف<textarea id="fd" rows="3"></textarea></label>
<label class="w">الصورة<input id="fi" type="file" accept="image/*"></label>
<label><span><input id="fx" type="checkbox" style="width:auto"> نفد من المخزون</span></label>
</div>
<div class="adm" style="margin-top:14px"><button class="btn" id="ok">حفظ ونشر</button><button class="btn g" id="cancel">إلغاء</button></div>
</dialog>
<div id="toast"></div>

<script id="db" type="application/json">[]</script>
<script>
const STORAGE_KEY='maison_ryx_products_v1';
const CURRENCY_KEY='maison_ryx_currency_v1';
let items=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
let owner=false,cat='all',q='',editing=null;
let currency=localStorage.getItem(CURRENCY_KEY)||'دج';

const $=s=>document.querySelector(s);
const cats={all:'الكل',perfume:'عطور',oil:'#',incense:'#',mist:'#'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)};
const persist=()=>{localStorage.setItem(STORAGE_KEY,JSON.stringify(items));localStorage.setItem(CURRENCY_KEY,currency)};

function bottle(id){
  let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%360;
  return `<svg viewBox="0 0 100 100" width="46%"><rect x="42" y="8" width="16" height="12" fill="#a8842f"/><rect x="45" y="20" width="10" height="8" fill="#7a6f60"/><rect x="24" y="28" width="52" height="62" rx="10" fill="hsl(${h} 35% 45%)" opacity=".85"/><rect x="32" y="48" width="36" height="22" fill="none" stroke="#f3e9d2" stroke-width=".8"/></svg>`
}

function render(){
  $('#chips').innerHTML=Object.entries(cats).map(([k,v])=>`<button class="chip ${k===cat?'on':''}" data-c="${k}">${v}</button>`).join(' ');
  $('#admin').innerHTML=owner
    ? `<button class="btn" id="add">+ إضافة عطر</button><button class="btn g" id="settings">إعدادات المتجر</button><button class="btn g" id="exit">خروج</button>`
    : `<button class="btn" id="manage">إدارة المتجر</button>`;
  const list=items.filter(i=>(cat==='all'||i.cat===cat)&&(!q||(i.name+' '+i.notes+' '+i.desc).toLowerCase().includes(q.toLowerCase())));
  $('#grid').innerHTML=list.map(i=>{
    const d=i.old>i.price?Math.round((1-i.price/i.old)*100):0;
    return `<article class="card ${i.out?'out':''}">
      <div class="img">${i.img?`<img src="${i.img}" alt="${esc(i.name)}">`:bottle(i.id)}</div>
      ${i.out?'<span class="tag">نفد</span>':i.badge?`<span class="tag">${esc(i.badge)}</span>`:''}
      <div class="body">
        <span class="kind">${i.kind==='own'?'من تصميم Ryx':'مختارات Ryx'}${i.size?' · '+i.size+' مل':''}</span>
        <h3 class="name">${esc(i.name)}</h3>
        ${i.notes?`<p class="notes">${esc(i.notes)}</p>`:''}
        ${i.desc?`<p class="desc">${esc(i.desc)}</p>`:''}
        <div class="price">${i.price} ${currency} ${d?`<s>${i.old} ${currency}</s><b>-${d}%</b>`:''}</div>
        ${owner?`<div class="adm"><button class="btn g" data-e="${i.id}">تعديل</button><button class="btn g" data-d="${i.id}">حذف</button></div>`:''}
      </div>
    </article>`
  }).join('')||'<p style="grid-column:1/-1;text-align:center;color:var(--mute)">لا توجد عطور بعد. ادخل إلى إدارة المتجر وأضف أول عطر.</p>';
}

const fields={fn:'name',fp:'price',fo:'old',fs:'size',fc:'cat',fk:'kind',fb:'badge',fnotes:'notes',fd:'desc'};

function openForm(id){
  editing=id;
  const it=items.find(x=>x.id===id)||{cat:'perfume',kind:'own'};
  for(const[k,v]of Object.entries(fields)) $('#'+k).value=it[v]??'';
  $('#fx').checked=!!it.out;
  $('#fi').value='';
  $('#dlg').showModal();
}

function resize(file){
  return new Promise(resolve=>{
    const im=new Image();
    im.onload=()=>{
      const s=Math.min(1,900/Math.max(im.width,im.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*s));
      c.height=Math.max(1,Math.round(im.height*s));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      resolve(c.toDataURL('image/jpeg',.82));
    };
    im.src=URL.createObjectURL(file);
  })
}

function manage(){
  owner=true; render(); toast('تم فتح إدارة المتجر');
}

function settings(){
  const v=prompt('اكتب العملة التي تريد عرضها (مثال: دج أو € أو $):',currency);
  if(v!==null && v.trim()){currency=v.trim();persist();render();toast('تم حفظ العملة')}
}

document.addEventListener('click',async e=>{
  const t=e.target;
  if(t.dataset.c){cat=t.dataset.c;render()}
  if(t.id==='manage')manage();
  if(t.id==='exit'){owner=false;render()}
  if(t.id==='settings')settings();
  if(t.id==='add')openForm(null);
  if(t.dataset.e)openForm(t.dataset.e);
  if(t.dataset.d){
    const item=items.find(x=>x.id===t.dataset.d);
    if(item && confirm(`هل تريد حذف "${item.name}"؟`)){
      items=items.filter(x=>x.id!==t.dataset.d);persist();render();toast('تم حذف العطر');
    }
  }
  if(t.id==='cancel')$('#dlg').close();
  if(t.id==='ok'){
    if(!$('#fn').value.trim()) return toast('اكتب اسم العطر');
    const old=items.find(x=>x.id===editing);
    const it={id:editing||'p'+Date.now(),img:old?.img||'',out:$('#fx').checked};
    for(const[k,v]of Object.entries(fields))
      it[v]=['price','old','size'].includes(v)?+$('#'+k).value||0:$('#'+k).value.trim();
    const f=$('#fi').files[0];
    if(f)it.img=await resize(f);
    items=editing?items.map(x=>x.id===editing?it:x):[it,...items];
    persist();$('#dlg').close();render();toast(editing?'تم تعديل العطر':'تمت إضافة العطر');
  }
});

$('#q').addEventListener('input',e=>{q=e.target.value.trim();render()});
render();
</script>
</body>
</html>
